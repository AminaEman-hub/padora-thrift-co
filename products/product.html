<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | Padora Thrift Co.</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="site-header">

    <div class="container nav-container">


        <a
            href="../index.html"
            class="logo-link"
        >

            <img
                src="../images/logo.png.png"
                alt="Padora Thrift Co. Logo"
            >

        </a>


        <nav class="main-nav">

            <a href="../index.html">
                Home
            </a>

            <a href="shop.html?category=women">
                Women
            </a>

            <a href="shop.html?category=men">
                Men
            </a>

            <a href="shop.html?category=sneakers">
                Sneakers
            </a>

            <a href="shop.html?category=flats">
                Flats
            </a>

            <a href="shop.html?category=heels">
                Heels
            </a>

            <a href="shop.html?category=boots">
                Boots
            </a>

        </nav>


        <a
            href="../index.html#contact"
            class="nav-button"
        >
            Contact
        </a>


    </div>

</header>



<!-- =========================
     PRODUCT
========================= -->

<main>


<section class="product-detail-section">

    <div class="container product-detail-grid">


        <!-- PRODUCT IMAGE -->

        <div class="product-detail-image">

            <img
                id="productImage"
                src=""
                alt=""
            >


            <div
                id="soldOverlay"
                class="sold-overlay"
            >
                SOLD OUT
            </div>

        </div>



        <!-- PRODUCT INFORMATION -->

        <div class="product-detail-info">


            <p
                id="productId"
                class="product-id"
            ></p>


            <h1
                id="productName"
            ></h1>


            <p
                id="productPrice"
                class="detail-price"
            ></p>



            <!-- PRODUCT DETAILS -->

            <div class="product-info-list">


                <div>

                    <span>
                        Condition
                    </span>

                    <strong
                        id="productCondition"
                    ></strong>

                </div>


                <div>

                    <span>
                        Size
                    </span>

                    <strong
                        id="productSize"
                    ></strong>

                </div>


                <div>

                    <span>
                        Brand
                    </span>

                    <strong
                        id="productBrand"
                    ></strong>

                </div>


                <div>

                    <span>
                        Availability
                    </span>

                    <strong
                        id="productAvailability"
                    ></strong>

                </div>


            </div>



            <!-- DESCRIPTION -->

            <p
                id="productDescription"
                class="product-description"
            ></p>



            <!-- ORDER BUTTON -->

            <div id="orderArea">

                <button
                    onclick="orderProduct()"
                    class="whatsapp-button"
                >
                    Order on WhatsApp
                </button>

            </div>



            <!-- BACK -->

            <a
                id="backToCollection"
                href="../index.html"
                class="back-link"
            >
                ← Back to Collection
            </a>


        </div>


    </div>

</section>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="site-footer">

    <div class="container footer-content">


        <div>

            <h3>
                Padora Thrift Co.
            </h3>


            <p>
                Pre-Loved Footwear • New Stories
            </p>

        </div>


        <div>

            <p>
                © 2026 Padora Thrift Co.
            </p>

        </div>


    </div>

</footer>



<!-- =========================
     PRODUCT DATA
========================= -->

<script src="../products.js"></script>



<!-- =========================
     PRODUCT LOGIC
========================= -->

<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const productId =
    params.get("id");


const product =
    products.find(
        item => item.id === productId
    );



/* =========================
   PRODUCT NOT FOUND
========================= */


if (!product) {


    document.querySelector("main").innerHTML = `

        <section class="product-detail-section">

            <div class="container empty-product">

                <h1>
                    Product Not Found
                </h1>

                <p>
                    This product could not be found.
                </p>

                <a
                    href="../index.html"
                    class="primary-button"
                >
                    Back to Home
                </a>

            </div>

        </section>

    `;


} else {


    /* =========================
       BASIC PRODUCT DETAILS
    ========================= */


    document.title =
        `${product.name} | Padora Thrift Co.`;



    document.getElementById(
        "productId"
    ).textContent =
        product.id;



    document.getElementById(
        "productName"
    ).textContent =
        product.name;



    document.getElementById(
        "productPrice"
    ).textContent =
        `PKR ${product.price.toLocaleString()}`;



    document.getElementById(
        "productImage"
    ).src =
        `../${product.image}`;



    document.getElementById(
        "productImage"
    ).alt =
        product.name;



    /* =========================
       PRODUCT INFORMATION
    ========================= */


    document.getElementById(
        "productCondition"
    ).textContent =
        product.condition;



    document.getElementById(
        "productSize"
    ).textContent =
        product.size;



    document.getElementById(
        "productBrand"
    ).textContent =
        product.brand;



    document.getElementById(
        "productAvailability"
    ).textContent =

        product.status === "sold"

        ? "SOLD OUT"

        : product.availability;



    document.getElementById(
        "productDescription"
    ).textContent =
        product.description;



    /* =========================
       SOLD OUT SYSTEM
    ========================= */


    const soldOverlay =
        document.getElementById(
            "soldOverlay"
        );


    const orderArea =
        document.getElementById(
            "orderArea"
        );



    if (
        product.status === "sold"
    ) {


        soldOverlay.style.display =
            "flex";


        orderArea.innerHTML = `

            <div class="sold-message">

                <strong>
                    SOLD OUT
                </strong>

                <p>
                    This one-of-a-kind pair has found its new story.
                </p>

            </div>

        `;


    } else {


        soldOverlay.style.display =
            "none";

    }



    /* =========================
       BACK TO CATEGORY
    ========================= */


    const backLink =
        document.getElementById(
            "backToCollection"
        );


    backLink.href =
        `shop.html?category=${product.category}`;

}



/* =========================
   WHATSAPP ORDER
========================= */


function orderProduct() {


    if (!product) {
        return;
    }


    if (
        product.status === "sold"
    ) {
        return;
    }



    const phoneNumber =
        "923002256465";



    const message =

        "Hi Padora Thrift Co.!%0A%0A" +

        "I am interested in this product:%0A%0A" +

        "Product: " +
        product.name +
        "%0A" +

        "Product ID: " +
        product.id +
        "%0A" +

        "Price: PKR " +
        product.price.toLocaleString() +
        "%0A%0A" +

        "Is this product available?";



    const whatsappURL =

        "https://wa.me/" +
        phoneNumber +
        "?text=" +
        message;



    window.open(
        whatsappURL,
        "_blank"
    );

}


</script>


</body>

</html>
