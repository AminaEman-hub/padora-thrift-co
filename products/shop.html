<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Padora Thrift Co. | Collection</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="container nav-container">

        <a
            href="../index.html"
            class="logo-link"
        >

            <img
                src="../images/logo.png.png"
                alt="Padora Thrift Co."
            >

        </a>


        <nav class="main-nav">

            <a href="../index.html">
                Home
            </a>

            <a href="shop.html?category=women">
                Women
            </a>

            <a href="shop.html?category=men">
                Men
            </a>

            <a href="shop.html?category=sneakers">
                Sneakers
            </a>

            <a href="shop.html?category=flats">
                Flats
            </a>

            <a href="shop.html?category=heels">
                Heels
            </a>

            <a href="shop.html?category=boots">
                Boots
            </a>

            <a
                href="../index.html#contact"
                class="nav-button"
            >
                Contact
            </a>

        </nav>

    </div>

</header>



<main>


<section class="collection-hero">

    <div class="container">

        <span class="eyebrow">
            Padora Thrift Co.
        </span>


        <h1 id="collection-title">
            Collection
        </h1>


        <p id="collection-description">
            Carefully selected pre-loved footwear,
            each with its own story.
        </p>

    </div>

</section>



<section class="products-section">

    <div class="container">

        <div
            id="products-container"
            class="product-grid"
        ></div>

    </div>

</section>


</main>



<footer class="site-footer">

    <div class="container">

        <div class="footer-content">


            <div class="footer-brand">

                <h3>
                    Padora Thrift Co.
                </h3>

                <p>
                    Pre-Loved Footwear • New Stories
                </p>

            </div>


            <div class="footer-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="../index.html#about">
                    Our Story
                </a>

                <a href="../index.html#contact">
                    Contact
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            © 2026 Padora Thrift Co. All rights reserved.

        </div>

    </div>

</footer>



<script>


/* =========================
   PRODUCT DATA
========================= */


const products = [

    {

        id: "PTC-001",

        category: "heels",

        name: "Green Strappy Heeled Mules",

        price: 1800,

        image:
            "../images/PTC-001%20IMAGE%201.jpeg",

        condition:
            "Excellent Condition",

        size:
            "6M (9 inch)",

        brand:
            "Steve Madden",

        status:
            "available",

        availability:
            "Available"

    }

];



/* =========================
   URL CATEGORY
========================= */


const params =
    new URLSearchParams(
        window.location.search
    );


const category =
    params.get("category");



/* =========================
   PAGE ELEMENTS
========================= */


const title =
    document.getElementById(
        "collection-title"
    );


const description =
    document.getElementById(
        "collection-description"
    );


const container =
    document.getElementById(
        "products-container"
    );



/* =========================
   CATEGORY NAMES
========================= */


const categoryNames = {

    women:
        "Women's Collection",

    men:
        "Men's Collection",

    sneakers:
        "Sneakers Collection",

    flats:
        "Flats Collection",

    heels:
        "Heels Collection",

    boots:
        "Boots Collection"

};



/* =========================
   CATEGORY DESCRIPTIONS
========================= */


const categoryDescriptions = {

    women:
        "Explore carefully selected pre-loved women's footwear.",

    men:
        "Explore carefully selected pre-loved men's footwear.",

    sneakers:
        "Comfortable and stylish pre-loved sneakers.",

    flats:
        "Elegant and comfortable pre-loved flats.",

    heels:
        "Statement heels selected for their style and condition.",

    boots:
        "Classic pre-loved boots ready for their next story."

};



/* =========================
   CATEGORY HEADER
========================= */


if (
    category &&
    categoryNames[category]
) {

    title.textContent =
        categoryNames[category];


    description.textContent =
        categoryDescriptions[category];

}



/* =========================
   FILTER PRODUCTS
========================= */


const filteredProducts =

    category

    ? products.filter(
        product =>
            product.category === category
    )

    : products;



/* =========================
   NO PRODUCTS
========================= */


if (
    filteredProducts.length === 0
) {

    container.innerHTML = `

        <div class="no-products">

            <h3>
                New Collection Coming Soon
            </h3>

            <p>
                We're carefully preparing new pieces
                for this collection.
            </p>

        </div>

    `;

}



/* =========================
   SHOW PRODUCTS
========================= */


else {

    container.innerHTML =

        filteredProducts
            .map(product => {


                const isSold =
                    product.status === "sold";


                return `

                    <article
                        class="product-card"
                    >


                        <div
                            class="product-image-wrapper"
                        >


                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                class="product-image"
                                loading="eager"
                            >


                            ${
                                isSold

                                ? `

                                    <span
                                        class="sold-badge"
                                    >
                                        SOLD OUT
                                    </span>

                                `

                                : `

                                    <span
                                        class="available-badge"
                                    >
                                        AVAILABLE
                                    </span>

                                `
                            }


                        </div>



                        <div
                            class="product-card-content"
                        >


                            <div
                                class="product-id"
                            >
                                ${product.id}
                            </div>



                            <h3>
                                ${product.name}
                            </h3>



                            <p>
                                ${product.condition}
                            </p>



                            <p>
                                Size: ${product.size}
                            </p>



                            <p>
                                Brand: ${product.brand}
                            </p>



                            <div
                                class="product-price"
                            >
                                PKR ${product.price.toLocaleString()}
                            </div>



                            ${
                                isSold

                                ? `

                                    <div
                                        class="sold-message"
                                    >
                                        SOLD OUT
                                    </div>

                                `

                                : `

                                    <a
                                        href="product.html?id=${product.id}"
                                        class="product-button"
                                    >
                                        View Product
                                    </a>

                                `
                            }


                        </div>


                    </article>

                `;

            })
            .join("");

}


</script>


</body>

</html>
